<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a new customer account on E-Shop to enjoy seamless ordering and order tracking.">
  <title>Register — E-Shop Mini Project</title>

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="header-nav">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-logo-icon">🛍️</div>
        <span>E-<span class="accent">Shop</span></span>
      </a>

      <div class="nav-actions">
        <a href="index.html" class="btn btn-secondary btn-sm">← Back to Store</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <div style="font-size: 2.4rem; margin-bottom: 8px;">✨</div>
          <h1>Create an Account</h1>
          <p>Join E-Shop to experience fast in-memory ordering</p>
        </div>

        <form id="register-form">
          <div class="form-group">
            <label class="form-label" for="name">Full Name *</label>
            <input type="text" id="name" class="form-control" required placeholder="e.g. Priya Patel" autocomplete="name" />
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Email Address *</label>
            <input type="email" id="email" class="form-control" required placeholder="priya@example.com" autocomplete="email" />
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password (Minimum 6 characters) *</label>
            <input type="password" id="password" class="form-control" required minlength="6" placeholder="Create a secure password" autocomplete="new-password" />
          </div>

          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm Password *</label>
            <input type="password" id="confirmPassword" class="form-control" required minlength="6" placeholder="Re-enter password" autocomplete="new-password" />
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
            Create Customer Account ➔
          </button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-muted);">
          Already registered? <a href="login.html" style="color: var(--primary); font-weight: 600;">Log in here</a>
        </div>

        <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border); font-size: 0.8rem; color: var(--text-muted); text-align: center;">
          🔒 Registered accounts are kept in Node.js server memory during execution.
        </div>
      </div>
    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container footer-bottom" style="border-top: none;">
      <div>© 2026 E-Shop Mini Project.</div>
      <div>Full Stack Web Development Coursework.</div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
